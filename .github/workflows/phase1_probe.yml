name: phase1-probe
# FlyFoundry Phase 1 (docs/PHASE1_SPEC.md): run the free public-API probes (Hacker News, GitHub, Stack Exchange) for the
# ideas in data/ideas.csv, then calibrate the automated layer-F score against the manual H01-H12 verdicts.
# Manual only. Same kill switch as the swarm: gh variable set SWARM_ENABLED --body true
on:
  workflow_dispatch:
    inputs:
      compare:
        description: "Optional earlier probe file in the repo (e.g. data/probes/run1.jsonl) for the 7-day stability check"
        default: ""

permissions:
  contents: read

concurrency:
  group: flyfoundry-swarm
  cancel-in-progress: false

jobs:
  probe:
    if: vars.SWARM_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (pinned lock file)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Probes (live network, rate-limited, cached)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m flyfoundry probe --cache out/probes.jsonl --max-requests 500
      - name: Calibration against the manual verdicts
        env:
          COMPARE: ${{ inputs.compare }}
        run: |
          extra=()
          if [ -n "$COMPARE" ]; then extra+=(--compare "$COMPARE"); fi
          python -m flyfoundry calibrate --facts out/probes.jsonl "${extra[@]}" --out out
      - name: Run summary
        if: always()
        run: if [ -f out/calibration.md ]; then cat out/calibration.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyfoundry-phase1-probe-${{ github.run_id }}
          path: out
          retention-days: 30
          if-no-files-found: warn
