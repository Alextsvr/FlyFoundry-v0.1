name: bounty-discovery
# Bounty Factory (docs/BOUNTY_FACTORY.md): daily discovery -> gate -> rank -> report. No paid APIs, no secrets, no submissions.
# GitHub may start scheduled runs hours late; the pipeline is idempotent so a late or doubled run is harmless.
# Disable without editing: gh variable set BOUNTY_ENABLED --body false
on:
  workflow_dispatch:
    inputs:
      provisional_briefs:
        description: "Also write PROVISIONAL briefs for the top N needs-review items"
        default: "3"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write     # push the orphan state branch only

concurrency:
  group: flyfoundry-bounty
  cancel-in-progress: false

env:
  STATE_DIR: state_bounty
  OUT_DIR: out/bounty
  STATE_BRANCH: flyfoundry-bounty-state

jobs:
  discover:
    if: vars.BOUNTY_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (pinned lock file)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Restore persistent state (orphan branch)
        run: bash scripts/state_restore.sh origin "$STATE_DIR"
      - name: Tests (fast, offline)
        run: python -m pytest -q tests/test_bounty.py
      - name: Discover, evaluate, report
        run: python -m flyfoundry bounty run --state-dir "$STATE_DIR" --out "$OUT_DIR" --provisional-briefs "${{ inputs.provisional_briefs || '3' }}"
      - name: Source health check (warn, do not hide)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          try:
              m = json.load(open(os.environ["OUT_DIR"] + "/metrics.json"))
              for s, r in m["sources"].items():
                  if r["status"] not in ("ok",) and s in ("devpost",):
                      print(f"::warning::source {s} status={r['status']} error={r['error']}")
              print(json.dumps(m["metrics"]["decisions"]))
          except Exception as e:
              print(f"::error::no metrics produced: {e}")
          PY
      - name: Persist state and latest report (always, even after partial failure)
        if: always()
        run: |
          if [ -f "$STATE_DIR/bounty.sqlite3" ]; then
            mkdir -p "$STATE_DIR/latest" && cp -r "$OUT_DIR"/. "$STATE_DIR/latest/" 2>/dev/null || true
            bash scripts/state_save.sh origin "$STATE_DIR" "bounty state $(date -u +%Y-%m-%dT%H:%MZ)"
          else
            echo "::warning::no state produced; nothing persisted"
          fi
      - name: Job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          try:
              rows = json.load(open(os.environ["OUT_DIR"] + "/opportunities.json"))
          except Exception:
              print("No report was produced; see the failed step."); raise SystemExit
          cand = sorted([r for r in rows if r["decision"] != "INELIGIBLE"], key=lambda r: r["rank_b"] or 9999)[:3]
          print("## Top 3 (UNVERIFIED unless marked)\n")
          for r in cand:
              print(f"- **{r['title']}** {r['decision']}{' VERIFIED' if r['verified'] else ' (unverified)'} | prize {r['prize_amount']} {r['prize_currency']} | deadline {r['deadline_date']} | {r['est_class']} | {r['url']}")
          PY
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyfoundry-bounty-${{ github.run_id }}
          path: out/bounty
          retention-days: 30
          if-no-files-found: warn
