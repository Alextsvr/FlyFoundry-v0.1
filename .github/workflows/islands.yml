name: islands
# FlyFoundry v0.2 E2: island model vs one big pool. Repeats are split into shards (parallel jobs, max 10), then a
# merge job runs scripts/analyze_e2.py. Manual only; same kill switch and concurrency group as the swarm workflow.
#   gh variable set SWARM_ENABLED --body true      /      gh variable set SWARM_ENABLED --body false
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Swarm repeats (pre-registered E2 value: 100)"
        default: "100"
      shards:
        description: "Number of parallel shard jobs (hard cap 10)"
        default: "10"

permissions:
  contents: read

concurrency:
  group: flyfoundry-swarm
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.p.outputs.enabled }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        env:
          SWARM_ENABLED: ${{ vars.SWARM_ENABLED }}
          REPEATS: ${{ inputs.repeats }}
          SHARDS: ${{ inputs.shards }}
        run: |
          if [ "$SWARM_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"shard\":[0]}" >> "$GITHUB_OUTPUT"
            echo "::notice::SWARM_ENABLED is not 'true' - nothing was run (kill switch)."
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          reps, shards = int(os.environ["REPEATS"]), int(os.environ["SHARDS"])
          if not (1 <= shards <= 10) or reps < shards or reps > 500:
              sys.exit("need 1 <= shards <= 10 and shards <= repeats <= 500 (resource cap)")
          print("enabled=true")
          print("matrix=" + json.dumps({"shard": list(range(shards))}))
          PY

  shard:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (pinned lock file)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Run shard
        run: |
          python -m flyfoundry islands --config configs/swarm_e1.json --repeats "${{ inputs.repeats }}" \
            --generations 60 --shard "${{ matrix.shard }}/${{ inputs.shards }}" --out e2_out
      - uses: actions/upload-artifact@v4
        with:
          name: e2-shard-${{ matrix.shard }}
          path: e2_out
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: [plan, shard]
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (pinned lock file)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          pattern: e2-shard-*
          path: e2_shards
      - name: Pre-registered E2 verdicts
        run: |
          mkdir -p reports/e2
          cp e2_shards/*/e2_shard_*.json reports/e2/
          python scripts/analyze_e2.py e2_shards --expect-repeats "${{ inputs.repeats }}" \
            --out reports/e2/e2_verdicts.md --json reports/e2/e2_verdicts.json
      - name: Run summary
        if: always()
        run: if [ -f reports/e2/e2_verdicts.md ]; then cat reports/e2/e2_verdicts.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyfoundry-e2-report-${{ github.run_id }}
          path: reports/e2
          retention-days: 7
          if-no-files-found: warn
