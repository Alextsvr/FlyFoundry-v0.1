name: experiment
# Manual runs (workflow_dispatch) and nightly runs at 01:30 Europe/Riga.
# GitHub cron is UTC only and Riga switches between UTC+3 (summer) and UTC+2 (winter), so two crons are
# registered and `flyfoundry schedule-guard` lets exactly one of them run per Riga calendar date, inside 01:00-03:59 local.
on:
  workflow_dispatch:
    inputs:
      generations:
        description: "Generations to advance in this run"
        default: "20"
      seeds:
        description: "Seeds per arm (ONLY used when starting a fresh experiment)"
        default: "5"
      pop_size:
        description: "Agents per population (ONLY used when starting a fresh experiment)"
        default: "100"
      fresh_start:
        description: "Start a NEW experiment (discards nothing, but resets the state branch to generation 0)"
        type: boolean
        default: false
  schedule:
    - cron: "30 22 * * *"   # 01:30 Europe/Riga during EEST (UTC+3)
    - cron: "30 23 * * *"   # 01:30 Europe/Riga during EET  (UTC+2)

permissions:
  contents: write      # push the orphan state branch
  actions: read        # query earlier runs

concurrency:
  group: flyfoundry-experiment
  cancel-in-progress: false

env:
  STATE_DIR: state
  OUT_DIR: reports/latest

jobs:
  run:
    runs-on: ubuntu-24.04      # standard hosted CPU runner (free for public repositories)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (pinned lock file)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Restore durable state (orphan branch flyfoundry-state)
        id: restore
        run: scripts/state_restore.sh origin "$STATE_DIR"

      - name: Schedule guard (01:00-03:59 Europe/Riga, once per local date)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          python -m flyfoundry schedule-guard --state-dir "$STATE_DIR" --tz Europe/Riga --window 1-3
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT";
          elif [ $rc -eq 10 ]; then echo "run=false" >> "$GITHUB_OUTPUT";
          else exit $rc; fi

      - name: Decide whether a fresh start is allowed
        id: policy
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_EXISTS: ${{ steps.restore.outputs.state_exists }}
          FRESH_INPUT: ${{ inputs.fresh_start }}
        run: |
          if [ "$STATE_EXISTS" = "true" ] && [ "$FRESH_INPUT" != "true" ]; then
            echo "allow_fresh=false" >> "$GITHUB_OUTPUT"; echo "mode=resume"; exit 0
          fi
          prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/experiment.yml/runs?status=success&per_page=1" --jq .total_count)
          if [ "$FRESH_INPUT" = "true" ] || [ "$prior" = "0" ]; then
            echo "allow_fresh=true" >> "$GITHUB_OUTPUT"; echo "mode=fresh (first run or explicit request)"
          else
            echo "::error::state branch is missing although $prior earlier successful experiment run(s) exist. Refusing to silently restart from generation 0. Restore the flyfoundry-state branch or re-run with fresh_start=true."
            exit 1
          fi

      - name: Run experiment (resume latest valid checkpoint)
        if: steps.guard.outputs.run == 'true'
        env:
          GENS: ${{ inputs.generations || '20' }}
          SEEDS: ${{ inputs.seeds || '5' }}
          POP: ${{ inputs.pop_size || '100' }}
          ALLOW_FRESH: ${{ steps.policy.outputs.allow_fresh }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          args=(run --config configs/nightly.json --state-dir "$STATE_DIR" --out "$OUT_DIR" --generations "$GENS" --time-budget-s 2400)
          if [ "$ALLOW_FRESH" = "true" ]; then
            args+=(--allow-fresh --seeds "$SEEDS" --pop-size "$POP")
            [ -d "$STATE_DIR" ] && [ -f "$STATE_DIR/manifest.json" ] && args+=(--overwrite-state) || true
          fi
          [ "$SCHEDULED" = "true" ] && args+=(--scheduled)
          python -m flyfoundry "${args[@]}"

      - name: Verify checkpoint integrity
        if: steps.guard.outputs.run == 'true'
        run: python -m flyfoundry validate --state-dir "$STATE_DIR"

      - name: Persist state (single-commit orphan branch)
        if: steps.guard.outputs.run == 'true'
        run: scripts/state_save.sh origin "$STATE_DIR" "state after run ${{ github.run_id }} (${{ github.sha }})"

      - name: Run summary
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          if [ -f "$OUT_DIR/summary.md" ]; then cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$OUT_DIR/error.md" ]; then cat "$OUT_DIR/error.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report artifact
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flyfoundry-report-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload report for GitHub Pages (optional)
        if: steps.guard.outputs.run == 'true' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  pages:
    # Optional: set repository variable ENABLE_PAGES=true and enable Pages (source: GitHub Actions).
    # Published content is the synthetic-benchmark dashboard only.
    needs: run
    if: vars.ENABLE_PAGES == 'true' && needs.run.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
